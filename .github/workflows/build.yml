name: 构建

on:
  push:
    branches: [main, "3.0.1"]
  pull_request:
  workflow_dispatch:

jobs:
  arch-linux:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: 安装构建依赖
        run: >-
          pacman -Syu --noconfirm git cmake clang boost ibus gtk4 libadwaita libc++
          json-c curl openssl bubblewrap util-linux python python-fonttools python-pillow fontconfig
          pipewire ffmpeg wl-clipboard libnotify polkit
      - uses: actions/checkout@v7
      - name: 配置
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: 构建
        run: cmake --build build --parallel
      - name: 检查脚本
        run: |
          for script in scripts/*.sh.in; do
            case "$script" in *-update.sh.in|*-sync.sh.in) continue;; esac
            sh -n "$script"
          done
          python3 -m py_compile scripts/*.py tools/*.py build/wetypex-sync
      - name: 构建 Arch 软件包 (启用 LTO)
        run: |
          python3 tools/package_release.py
          useradd -m builder
          chown -R builder:builder dist/arch
          cp /etc/makepkg.conf /tmp/wetypex-makepkg.conf
          printf '%s\n' 'OPTIONS=("${OPTIONS[@]/!lto/lto}" lto)' \
            >> /tmp/wetypex-makepkg.conf
          su builder -c "cd '$PWD/dist/arch' && makepkg --config /tmp/wetypex-makepkg.conf -C -f --noconfirm"
          cd dist/arch
          sha256sum ibus-wetypex-*-x86_64.pkg.tar.zst > SHA256SUMS
      - name: 保存 Arch 测试包
        uses: actions/upload-artifact@v7
        with:
          name: ibus-wetypex-arch-package
          path: |
            dist/arch/ibus-wetypex-*-x86_64.pkg.tar.zst
            dist/arch/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  ubuntu-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: 安装 nFPM 与 XML 校验工具
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          sudo install "$(go env GOPATH)/bin/nfpm" /usr/local/bin/nfpm
      - name: 构建 Ubuntu 软件包
        env:
          WETYPEX_BUILD_JOBS: "2"
        run: bash packaging/build-ubuntu-package.sh
      - name: 验证 DEB 包元数据与前端依赖
        shell: bash
        run: |
          package=$(find dist/ubuntu -maxdepth 1 -type f -name 'ibus-wetypex_*.deb' -print -quit)
          test -n "$package"
          test "$(dpkg-deb -f "$package" Package)" = ibus-wetypex
          dpkg-deb -f "$package" Depends | grep -Eq '(^|, )ibus(,|$)'
          dpkg-deb --fsys-tarfile "$package" | tar -xOf - ./usr/share/ibus/component/wetypex.xml | xmllint --noout -
          dpkg-deb --contents "$package" | grep -F './usr/libexec/ibus-engine-wetypex'
          dpkg-deb --contents "$package" | grep -F './usr/bin/wetypex-setup'
          dpkg-deb --contents "$package" | grep -F './usr/bin/wetypex-settings'
          dpkg-deb --contents "$package" | grep -F './usr/share/applications/ibus-setup-wetypex.desktop'
          dpkg-deb --contents "$package"
      - uses: actions/upload-artifact@v7
        with:
          name: ibus-wetypex-ubuntu
          path: |
            dist/ubuntu/ibus-wetypex_*.deb
          if-no-files-found: error
          retention-days: 30

  ubuntu-runtime:
    needs: ubuntu-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
          - image: ubuntu:24.04
          - image: ubuntu:26.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ibus-wetypex-ubuntu
          path: packages
      - name: 安装软件包并启动网络诊断
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./packages/*.deb
          wetypex-account network-info

  fedora-rpm:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装构建依赖
        run: |
          dnf install -y \
            git cmake gcc-c++ clang make \
            libstdc++-devel libcxx-devel \
            glib2-devel gtk3-devel gtk4-devel \
            libadwaita-devel ibus-devel json-c-devel \
            libcurl-devel pkgconf-pkg-config \
            bubblewrap rpm-build rpmdevtools \
            tar gzip

      - name: 配置与构建
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel 1 --verbose

      - name: 暂存安装文件
        run: |
          rm -rf pkg
          DESTDIR="$PWD/pkg" cmake --install build --prefix /usr

      - name: 生成 RPM spec
        run: |
          version=$(sed -n 's/^project([^ ]* VERSION \([^ ]*\).*/\1/p' CMakeLists.txt | head -n1)
          test -n "$version"
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p dist/fedora
          tar -czf ~/rpmbuild/SOURCES/ibus-wetypex.tar.gz -C pkg .
          sed 's/^[[:space:]]*//' > ~/rpmbuild/SPECS/ibus-wetypex.spec <<EOF
          %global debug_package %{nil}

          Name:           ibus-wetypex
          Version:        ${version}
          Release:        5%{?dist}
          Summary:        WeTypeX IBus input method
          License:        MIT
          BuildArch:      x86_64
          Requires:       python3
          Requires:       bubblewrap
          Requires:       pipewire-utils

          %description
          WeTypeX IBus input method for Fedora Linux.

          %prep
          %setup -q -c -T
          tar -xzf %{_sourcedir}/ibus-wetypex.tar.gz

          %install
          mkdir -p %{buildroot}
          cp -a usr %{buildroot}/

          %files
          /usr/bin/*
          /usr/lib64/*
          /usr/libexec/*
          /usr/share/*

          %changelog
          * $(LC_ALL=C date '+%a %b %d %Y') WeTypeX CI <noreply@example.com> - ${version}-1
          - Initial Fedora package
          EOF

      - name: 构建 RPM
        run: |
          rpmbuild -ba ~/rpmbuild/SPECS/ibus-wetypex.spec
          cp ~/rpmbuild/RPMS/*/*.rpm dist/fedora/

      - name: 保存 Fedora RPM
        uses: actions/upload-artifact@v7
        with:
          name: ibus-wetypex-fedora-rpm
          path: dist/fedora/*.rpm
          if-no-files-found: error
          retention-days: 30
