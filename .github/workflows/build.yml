name: 构建

on:
  push:
    branches: [main]
  pull_request:

jobs:
  arch-linux:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: 安装构建依赖
        run: >-
          pacman -Syu --noconfirm git cmake clang boost ibus gtk4 libadwaita libc++
          json-c curl openssl bubblewrap util-linux python python-fonttools python-pillow fontconfig
          pipewire ffmpeg wl-clipboard libnotify polkit
      - uses: actions/checkout@v7
      - name: 配置
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: 构建
        run: cmake --build build --parallel
      - name: 检查脚本
        run: |
          for script in scripts/*.sh.in; do
            case "$script" in *-update.sh.in|*-sync.sh.in) continue;; esac
            sh -n "$script"
          done
          python3 -m py_compile scripts/setup_runtime.py scripts/wechat_emoticons.py scripts/voice_stream.py tools/*.py \
            build/wetypex-update build/wetypex-sync
      - name: 构建 Arch 软件包 (启用 LTO)
        run: |
          python3 tools/package_release.py
          useradd -m builder
          chown -R builder:builder dist/arch
          cp /etc/makepkg.conf /tmp/wetypex-makepkg.conf
          printf '%s\n' 'OPTIONS=("${OPTIONS[@]/!lto/lto}" lto)' \
            >> /tmp/wetypex-makepkg.conf
          su builder -c "cd '$PWD/dist/arch' && makepkg --config /tmp/wetypex-makepkg.conf -C -f --noconfirm"
          cd dist/arch
          sha256sum ibus-wetypex-*-x86_64.pkg.tar.zst > SHA256SUMS
      - name: 保存 Arch 测试包
        uses: actions/upload-artifact@v7
        with:
          name: ibus-wetypex-arch-package
          path: |
            dist/arch/ibus-wetypex-*-x86_64.pkg.tar.zst
            dist/arch/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  ubuntu-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: 安装 DEB 包构建与 XML 校验工具
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          sudo install "$(go env GOPATH)/bin/nfpm" /usr/local/bin/nfpm
      - name: 构建 Ubuntu 软件包
        env:
          WETYPEX_BUILD_JOBS: "2"
        run: bash packaging/build-ubuntu-package.sh
      - name: 验证 DEB 包元数据与前端依赖
        shell: bash
        run: |
          package=$(find dist/ubuntu26 -maxdepth 1 -type f -name 'ibus-wetypex_*.deb' -print -quit)
          test -n "$package"
          test "$(dpkg-deb -f "$package" Package)" = ibus-wetypex
          dpkg-deb -f "$package" Depends | grep -Eq '(^|, )ibus(,|$)'
          ! dpkg-deb -f "$package" Depends | grep -qi fcitx
          dpkg-deb --fsys-tarfile "$package" \
            | tar -xOf - ./usr/share/ibus/component/wetypex.xml \
            | xmllint --noout -
          dpkg-deb --contents "$package" | grep -F './usr/libexec/ibus-engine-wetypex'
          dpkg-deb --contents "$package" | grep -F './usr/bin/wetypex-setup'
          dpkg-deb --contents "$package" | grep -F './usr/bin/wetypex-settings'
          dpkg-deb --contents "$package" | grep -F './usr/share/applications/ibus-setup-wetypex.desktop'
          dpkg-deb --contents "$package"
      - uses: actions/upload-artifact@v7
        with:
          name: ibus-wetypex-ubuntu
          path: |
            dist/ubuntu22/ibus-wetypex_*.deb
            dist/ubuntu24/ibus-wetypex_*.deb
            dist/ubuntu26/ibus-wetypex_*.deb
          if-no-files-found: error
          retention-days: 30

  ubuntu-runtime:
    needs: ubuntu-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            package_dir: ubuntu22
          - image: ubuntu:24.04
            package_dir: ubuntu24
          - image: ubuntu:26.04
            package_dir: ubuntu26
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ibus-wetypex-ubuntu
          path: packages
      - name: 安装软件包并启动网络诊断
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./packages/${{ matrix.package_dir }}/*.deb
          wetypex-account network-info
