name: ibus-wetypex
arch: amd64
platform: linux
version: "@WETYPEX_VERSION@"
release: "@WETYPEX_RELEASE@"
section: utils
priority: optional
maintainer: WeTypeX contributors <https://github.com/panxuc/fcitx5-wetypex>
description: WeTypeX native Linux input method for IBus
vendor: WeTypeX contributors
homepage: https://github.com/panxuc/fcitx5-wetypex
license: MIT AND curl AND ISC AND BSD-2-Clause AND Apache-2.0
contents:
  - src: "@WETYPEX_STAGE@/"
    dst: /
    type: tree
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libstdc++6 (>= 11)
      - libc++1
      - llvm-libunwind1 | libunwind-x.y
      - libssl3 | libssl3t64
      - ca-certificates
      - libjson-c5
      - ibus
      - libibus-1.0-5
      - libglib2.0-0t64
      - libqt6widgets6
      - libqt6network6
      - libqt6dbus6
      - libqt6svg6
      - libqt6webenginewidgets6
      - bubblewrap
      - util-linux
      - python3
      - python3-fonttools
      - python3-pil
      - fontconfig
      - libfontconfig1
      - libwayland-client0
      - pipewire-bin | pipewire
      - ffmpeg
      - wl-clipboard
      - libnotify-bin
      - pkexec | policykit-1
