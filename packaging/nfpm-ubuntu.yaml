name: ibus-wetypex
arch: amd64
platform: linux
version: "@WETYPEX_VERSION@"
release: "@WETYPEX_RELEASE@"
section: utils
priority: optional
maintainer: WeTypeX contributors <https://github.com/chencaidy/ibus-wetypex>
description: WeTypeX native Linux input method for IBus
vendor: WeTypeX contributors
homepage: https://github.com/chencaidy/ibus-wetypex
license: MIT AND curl AND ISC AND BSD-2-Clause AND Apache-2.0
scripts:
  postinstall: "@WETYPEX_PROJECT_ROOT@/packaging/post-install.sh"
contents:
  - src: "@WETYPEX_STAGE@/"
    dst: /
    type: tree
overrides:
  deb:
    depends:
      - bubblewrap
      - ca-certificates
      - ffmpeg
      - fontconfig
      - ibus
      - libadwaita-1-0
      - libc++1
      - libc6 (>= 2.35)
      - libgtk-4-1
      - libjson-c5
      - libnotify-bin
      - libssl3 | libssl3t64
      - libstdc++6 (>= 11)
      - llvm-libunwind1 | libunwind-x.y
      - pipewire-bin | pipewire
      - pkexec | policykit-1
      - python3
      - python3-fonttools
      - python3-pil
      - util-linux
